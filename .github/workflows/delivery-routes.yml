name: Delivery route checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node tests/sales-summary.test.cjs
      - run: node tests/eod-layout.test.cjs
      - run: node --check delivery-routes.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node tests/sales-summary-ui.test.cjs
